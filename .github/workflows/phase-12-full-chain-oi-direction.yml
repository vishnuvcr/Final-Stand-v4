name: Phase 12 Full Chain OI Direction
on:
  push:
    branches: [phase-12-full-chain-oi-direction]
    paths:
      - '.github/workflows/phase-12-full-chain-oi-direction.yml'
      - 'scripts/phase12/**'
  workflow_dispatch:
    inputs:
      years:
        description: 'Comma-separated option years'
        required: true
        default: '2024,2025,2026'
        type: string
permissions:
  contents: write

concurrency:
  group: phase12-full-chain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase12:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record execution start
        run: |
          mkdir -p results
          date -u +%Y-%m-%dT%H:%M:%SZ > results/phase12_execution_started_utc.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase12_execution_started_utc.txt
          git commit -m 'Mark Phase 12 execution start' || true
          git push origin HEAD:phase-12-full-chain-oi-direction

      - name: Validate research files
        run: |
          set -e
          test -f research/research_plan_phase12.md
          test -f research/full_chain_data_requirements_phase12.md
          test -f logs/decision_log_phase12.md
      - name: Install dependencies
        run: python -m pip install --upgrade pandas pyarrow scipy scikit-learn huggingface_hub
      - name: Cache Phase 11/12 market data
        uses: actions/cache@v4
        with:
          path: data_cache/phase11
          key: phase12-market-${{ runner.os }}-${{ hashFiles('research/data_manifest_phase11.json') }}
          restore-keys: |
            phase12-market-${{ runner.os }}-
            phase11-market-${{ runner.os }}-
      - name: Acquire market data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/phase11/acquire.py --years "${{ inputs.years || '2024,2025,2026' }}" --output data_cache/phase11
      - name: Extract full-chain features
        run: python scripts/phase12/extract_full_chain.py
      - name: Analyze full-chain direction
        run: python scripts/phase12/analyze_full_chain.py
      - name: Upload Phase 12 results
        uses: actions/upload-artifact@v4
        with:
          name: phase12-full-chain-results
          path: |
            results/phase12_full_chain_features.csv
            results/phase12_full_chain_manifest.json
            results/phase12_full_chain_analysis.json
            results/phase12_full_chain_analysis.md

      - name: Record execution failure
        if: failure()
        run: |
          mkdir -p results
          date -u +%Y-%m-%dT%H:%M:%SZ > results/phase12_execution_failed_utc.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase12_execution_failed_utc.txt
          git commit -m 'Mark Phase 12 execution failure' || true
          git fetch origin phase-12-full-chain-oi-direction
          git rebase origin/phase-12-full-chain-oi-direction || git rebase --abort
          git push origin HEAD:phase-12-full-chain-oi-direction || true

      - name: Publish derived results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase12_full_chain_features.csv results/phase12_full_chain_manifest.json results/phase12_full_chain_analysis.json results/phase12_full_chain_analysis.md
          git diff --cached --quiet || git commit -m 'Run Phase 12 full-chain OI direction analysis'
          for attempt in 1 2 3; do
            git fetch origin phase-12-full-chain-oi-direction
            git rebase origin/phase-12-full-chain-oi-direction || { git rebase --abort; exit 1; }
            git push origin HEAD:phase-12-full-chain-oi-direction && exit 0
            sleep $((attempt * 2))
          done
          exit 1
