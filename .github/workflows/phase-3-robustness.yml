name: Phase 3 - Robustness Grid

on:
  workflow_dispatch:
  push:
    branches:
      - phase-3-robustness

permissions:
  contents: write

jobs:
  scenario:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '0.90'
            slip: '0.10'
          - target: '0.95'
            slip: '0.10'
          - target: '1.00'
            slip: '0.00'
          - target: '1.00'
            slip: '0.10'
          - target: '1.00'
            slip: '0.25'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      YEARS: '2025,2026'
      TARGET_FRAC: ${{ matrix.target }}
      SLIPPAGE_POINTS: ${{ matrix.slip }}
      BROKERAGE_PER_ORDER: '20'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OUT_DIR: results/scenario_${{ matrix.target }}_${{ matrix.slip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            data_cache
            ~/.cache/huggingface
          key: phase3-hf-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/backtest.py') }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python scripts/backtest.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path('${{ env.OUT_DIR }}')
          s=pd.read_csv(p/'summary.csv')
          s['target_frac']=float('${{ matrix.target }}')
          s['slippage_points']=float('${{ matrix.slip }}')
          s.to_csv(p/'summary.csv',index=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scenario-${{ matrix.target }}-${{ matrix.slip }}
          path: ${{ env.OUT_DIR }}

  aggregate:
    needs: scenario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: phase3_artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - name: Aggregate sensitivity results
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          files=list(Path('phase3_artifacts').glob('**/summary.csv'))
          frames=[pd.read_csv(f) for f in files]
          out=pd.concat(frames,ignore_index=True).sort_values(['target_frac','slippage_points','side'])
          Path('results').mkdir(exist_ok=True)
          out.to_csv('results/phase3_sensitivity.csv',index=False)
          print(out.to_string(index=False))
          PY
      - name: Update research status and README
        run: |
          cat >> research/research_status.md <<'EOF'

          ## Phase 3 robustness grid execution
          - Target fractions: 90%, 95%, 100% of initial flatline.
          - Slippage: 0.00, 0.10, 0.25 option-premium points per execution.
          - Brokerage: ₹20 per executed order.
          - All scenarios use the validated current-spot OTM8 re-centering logic.
          EOF
          printf '\n## Phase 3 sensitivity output\n- [Robustness grid](results/phase3_sensitivity.csv)\n' >> README.md
      - name: Commit aggregate research output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase3_sensitivity.csv research/research_status.md README.md
          git diff --cached --quiet || git commit -m 'Record Phase 3 robustness results [skip ci]'
          git push
