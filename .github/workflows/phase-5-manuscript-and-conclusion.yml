name: Phase 5 - Manuscript and Conclusion
on:
  workflow_dispatch:
  push:
    branches:
      - phase-5-manuscript-and-conclusion
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      YEARS: '2025,2026'
      TARGET_FRAC: '1.00'
      SLIPPAGE_POINTS: '0.10'
      BROKERAGE_PER_ORDER: '20'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            data_cache
            ~/.cache/huggingface
          key: phase5-hf-${{ runner.os }}-${{ hashFiles('requirements.txt','scripts/backtest.py') }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python scripts/backtest.py
      - run: python scripts/analyze_results.py
      - run: python scripts/make_charts.py
      - name: Commit generated results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results
          git diff --cached --quiet || git commit -m 'Regenerate final baseline results with date-aware charges [skip ci]'
          git push
