name: Phase 11 Premium Direction Predictor

on:
  push:
    branches:
      - phase-11-premium-direction-predictor
    paths:
      - 'research/*phase11*'
      - 'logs/*phase11*'
      - '.github/workflows/phase-11-premium-direction-predictor.yml'
      - 'scripts/phase11/**'
      - 'tests/phase11/**'
      - 'research/data_manifest_phase11.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protocol-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate research files
        run: |
          test -f research/research_plan_phase11.md
          test -f research/strategy_spec_phase11.md
          test -f research/research_status_phase11.md
          test -f research/literature_review_phase11.md
          test -f research/data_manifest_phase11.json
          test -f logs/decision_log_phase11.md
          test -f logs/error_log_phase11.md

      - name: Validate JSON manifest
        run: python -m json.tool research/data_manifest_phase11.json >/dev/null

      - name: Run Phase 11 tests when present
        run: |
          if [ -d tests/phase11 ] && find tests/phase11 -type f -name 'test_*.py' | grep -q .; then
            pytest -q tests/phase11
          else
            echo 'Phase 11 computational tests are not initialized yet.'
          fi

      - name: Write run marker
        run: |
          mkdir -p results
          python - <<'PY'
from pathlib import Path
from datetime import datetime, timezone
Path('results/phase11_protocol_validation_utc.txt').write_text(
    datetime.now(timezone.utc).isoformat() + '\n'
)
PY

      - name: Commit validation marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/phase11_protocol_validation_utc.txt
          git diff --cached --quiet || git commit -m 'Validate Phase 11 research protocol'
          git push
