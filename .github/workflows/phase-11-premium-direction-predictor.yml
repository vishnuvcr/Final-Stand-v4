name: Phase 11 Premium Direction Predictor

on:
  push:
    branches:
      - phase-11-premium-direction-predictor
    paths:
      - '.github/workflows/phase-11-premium-direction-predictor.yml'
      - 'scripts/phase11/**'
      - 'tests/phase11/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Phase 11 action'
        required: true
        default: 'validate'
        type: choice
        options:
          - validate
          - acquire
          - build
      years:
        description: 'Comma-separated NIFTY option years to cache'
        required: true
        default: '2024,2025,2026'
        type: string

permissions:
  contents: write

jobs:
  phase11:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate research files
        run: |
          set -e
          test -f research/research_plan_phase11.md
          test -f research/strategy_spec_phase11.md
          test -f research/research_status_phase11.md
          test -f research/literature_review_phase11.md
          test -f research/data_manifest_phase11.json
          test -f logs/decision_log_phase11.md
          test -f logs/error_log_phase11.md
          python -m json.tool research/data_manifest_phase11.json >/dev/null

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pytest pandas pyarrow scipy

      - name: Run core predictor unit tests
        run: pytest -q tests/phase11

      - name: Cache Phase 11 market data
        if: inputs.action == 'acquire' || github.event_name == 'push' || inputs.action == 'build' || github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: data_cache/phase11
          key: phase11-market-${{ runner.os }}-${{ hashFiles('research/data_manifest_phase11.json') }}
          restore-keys: |
            phase11-market-${{ runner.os }}-

      - name: Acquire candidate data
        if: inputs.action == 'acquire' || github.event_name == 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          python scripts/phase11/acquire.py --years "${{ inputs.years || '2024,2025,2026' }}" --output data_cache/phase11

      - name: Build Phase 11 event dataset
        if: inputs.action == 'build' || (github.event_name == 'push' && hashFiles('results/phase11_events.csv') == '')
        run: |
          python scripts/phase11/build_events.py --input data_cache/phase11 --output results/phase11_events.csv

      - name: Independent source audit
        if: inputs.action == 'build' || github.event_name == 'push'
        run: python scripts/phase11/cross_source_audit.py

      - name: Statistical analysis
        if: inputs.action == 'build' || github.event_name == 'push'
        run: python scripts/phase11/analyze.py

      - name: Premium combination search
        if: inputs.action == 'build' || github.event_name == 'push'
        run: python scripts/phase11/premium_combination_search.py

      - name: Commit derived event dataset
        if: inputs.action == 'build' || github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The research branch may advance while this workflow is running (for example from a concurrent log/status update).
          # Rebase before the first push and retry if another fast-forward lands between rebase and push.
          git add results/phase11_events.csv results/phase11_events.json results/phase11_statistical_analysis.json results/phase11_statistical_analysis.md results/phase11_cross_source_audit.json results/phase11_premium_combination_search.json results/phase11_premium_combination_search.md
          git diff --cached --quiet || git commit -m 'Build Phase 11 event dataset'
          for attempt in 1 2 3; do
            git fetch origin phase-11-premium-direction-predictor
            git rebase origin/phase-11-premium-direction-predictor || {
              git rebase --abort
              echo 'Rebase conflict while publishing derived results; leaving generated files in the runner for inspection.'
              exit 1
            }
            git push origin HEAD:phase-11-premium-direction-predictor && exit 0
            sleep $((attempt * 2))
          done
          echo 'Unable to publish derived results after three attempts.'
          exit 1

      - name: Report acquisition footprint
        if: inputs.action == 'acquire' || github.event_name == 'push'
        run: |
          find data_cache/phase11 -maxdepth 5 -type f -printf '%p %s bytes\n' | sort